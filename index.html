<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12283c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>美国国债收益计算器</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>美国国债收益计算器</h1><small>V4.2 · USD</small></div><span id="offline">离线资源准备中</span></header><nav><button id="bill">短期 T-Bills</button><button id="bond">中长期 Notes / Bonds</button></nav><section><h2>基本交易参数</h2><div class="grid" id="inputs"></div><div id="quick"></div><div id="term" class="summary"></div></section><section id="accrual" hidden><h2>付息周期与应计利息</h2><div id="accrualBody"></div></section><section><h2>投资收益测算</h2><div id="results" aria-live="polite"></div><details id="formulas"><summary>计算公式与验算过程</summary><div id="formulaBody"></div></details><div class="actions"><button id="reset">重置参数</button><button id="copy">复制计算结果</button></div><textarea id="fallback" hidden readonly></textarea></section><footer>短期美债采用 ACT/365 单利年化；中长期采用正常半年付息周期及半年复利折现估算 YTM。特殊首期票息需核对发行条款。不适用于 TIPS、FRNs。不含税费、提前卖出损益及汇率变化。实际结算以 IBKR 为准。示例报价非实时行情。参数仅保存在当前设备。</footer></main><script src="app.js"></script></body></html>
